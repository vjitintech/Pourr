<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b26">
<title>Pourr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
/* Layout: one-screen app. Header, a big vessel in the middle, controls docked at the bottom. */
:root{
  --bg:#eaf1f4; --surface:#ffffff; --fg:#0e2230; --muted:#5b7182; --line:#cfdde5;
  --water:#1683c4; --water-2:#5fc0ec; --clay:#b4602f; --clay-2:#e3a173; --ok:#1f8a5b; --warn:#b5751a;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1720; --surface:#132430; --fg:#e4eef4; --muted:#8aa2b2; --line:#22394a;
  --water:#3aa6e6; --water-2:#7fd2f7; --clay:#d98450; --clay-2:#f0b48a; --ok:#3cc488; --warn:#e3a54a;
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
@supports (height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  -webkit-tap-highlight-color:transparent;overflow:hidden}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-block:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:800 22px/1 var(--display);letter-spacing:-.02em}
.brand span{color:var(--water)}
.pill{font:500 12px/1 var(--mono);padding:7px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.pill.on{color:var(--fg)}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
h1{font:800 clamp(30px,9vw,44px)/1.02 var(--display);letter-spacing:-.03em;margin:8px 0 4px;text-wrap:balance}
h2{font:700 22px/1.15 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted);max-width:60ch}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.role{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:20px;padding:18px 14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;font:inherit}
.role:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.role svg{width:64px;height:64px}
.role b{font:700 20px/1 var(--display)}
.role small{color:var(--muted);font-size:13px;line-height:1.35}
.role.jug:hover{border-color:var(--clay)} .role.cont:hover{border-color:var(--water)}
.steps{display:grid;gap:8px;margin-top:4px;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;color:var(--muted);font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);font:500 12px/26px var(--mono);text-align:center;border-radius:50%;background:var(--surface);border:1px solid var(--line);height:26px;color:var(--fg)}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font:600 16px/1 var(--body);cursor:pointer;background:var(--fg);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn.water{background:var(--water);color:#fff}
.btn.clay{background:var(--clay);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qr{background:#fff;border-radius:14px;padding:12px;align-self:center;width:min(78vw,300px);aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.qr img{width:100%;height:100%;image-rendering:pixelated}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1;width:100%;max-width:340px;align-self:center}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam::after{content:"";position:absolute;inset:14%;border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
textarea{width:100%;min-height:72px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:12px/1.4 var(--mono);padding:10px;resize:vertical}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
details[open] summary{margin-bottom:8px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--warn);font-size:14px}

/* Vessel stage */
.stage{flex:1;min-height:300px;position:relative;display:flex;align-items:center;justify-content:center}
.vessel{position:relative;width:min(70vw,280px);height:min(58vh,380px);transition:transform .12s linear;transform-origin:50% 85%}
.vessel svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.inside{position:absolute;left:12%;right:12%;top:16%;bottom:7%;overflow:hidden;border-radius:6px 6px 28px 28px;display:flex;flex-direction:column-reverse;gap:6px;padding:8px}
.waterfill{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(180deg,color-mix(in srgb,var(--water-2) 55%,transparent),color-mix(in srgb,var(--water) 70%,transparent));transition:height .25s ease;z-index:0}
.waterfill::before{content:"";position:absolute;left:-20%;right:-20%;top:-8px;height:16px;background:radial-gradient(ellipse at 50% 100%,color-mix(in srgb,var(--water-2) 60%,transparent) 60%,transparent 62%);animation:wave 2.4s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(8%)}}
.tile{position:relative;z-index:1;display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12.5px;box-shadow:0 2px 6px rgba(10,30,45,.12);min-width:0;flex:none}
.tile .ext{font:600 10px/1 var(--mono);text-transform:uppercase;background:var(--fg);color:var(--bg);border-radius:6px;height:26px;display:grid;place-items:center;letter-spacing:.04em;overflow:hidden}
.tile .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tile .sz{font:400 10.5px/1.2 var(--mono);color:var(--muted)}
.tile .bar{position:absolute;left:8px;right:8px;bottom:2px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.tile .bar b{display:block;height:100%;width:0;background:var(--water)}
.tile.leaving{animation:pourOut .7s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes pourOut{to{transform:translate(var(--dx,160%),-140%) rotate(var(--rot,35deg)) scale(.6);opacity:0}}
.tile.arriving{animation:dropIn .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dropIn{from{transform:translateY(-320%) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.tilt-read{position:absolute;top:0;left:0;font:500 12px/1 var(--mono);color:var(--muted)}
.speed{position:absolute;top:0;right:0;font:500 12px/1 var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.gauge{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font:600 13px/1.2 var(--body);color:var(--muted);text-align:center;width:100%}
.dock{display:flex;flex-direction:column;gap:10px}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:20%;z-index:1;pointer-events:none}
.saved-list{display:grid;gap:6px;max-height:30vh;overflow:auto}
.saved-list a{color:var(--water);font-size:14px;word-break:break-all}
.hdr-right{display:flex;gap:8px;align-items:center;min-width:0}
.btn.small{min-height:34px;padding:8px 12px;font-size:13px;border-radius:999px}
.btn.small.armed{border-color:var(--warn);color:var(--warn)}
.tile .cnt{position:absolute;top:-7px;right:6px;font:600 10px/1 var(--mono);background:var(--water);color:#fff;border-radius:999px;padding:3px 6px;font-variant-numeric:tabular-nums}
.tile.done .cnt{background:var(--ok)}
.status{font:600 14px/1.3 var(--body);color:var(--fg);text-align:center;font-variant-numeric:tabular-nums}
.status.ok{color:var(--ok)}
.banner{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.save-opts{display:grid;gap:8px}
/* Responsive layout: phones stack vessel over controls; wide or landscape screens put controls beside the vessel. */
.app{max-width:1120px}
main.home,main.pair{align-items:center}
main.home > *,main.pair > *{width:100%;max-width:560px}
main.work{display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
main.work .dock{max-height:46dvh;overflow-y:auto;width:100%;max-width:560px;justify-self:center;padding-bottom:2px}
.stage{container-type:size;flex:none;height:100%;min-height:220px}
.vessel{height:auto;aspect-ratio:200/280;width:min(calc((100cqh - 56px) * .714),calc(100cqw - 24px),320px);max-width:100%}
.qr{width:min(84vw,360px,46dvh)}
@media (min-width:760px){
  main.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;align-content:start;gap:16px}
  main.pair > *{max-width:none}
  main.pair > .btn{grid-column:1/-1;justify-self:start;width:auto}
}
@media (min-width:760px), (orientation:landscape) and (min-width:560px){
  main.work{grid-template-columns:minmax(0,1fr) minmax(260px,380px);grid-template-rows:minmax(0,1fr);align-items:center;gap:20px}
  main.work .dock{max-height:100%;justify-self:stretch}
}
@media (max-height:600px){.app{gap:8px;padding-block:8px} h1{font-size:26px;margin-top:2px} .role{padding:12px} .role svg{width:40px;height:40px} .btn{min-height:44px;padding:11px 14px}}
@media (max-width:380px){.brand{font-size:19px} .roles{grid-template-columns:1fr} .role{display:grid;grid-template-columns:44px 1fr;align-items:center;column-gap:12px} .role svg{width:44px;height:44px;grid-row:span 2} .pill{padding:6px 8px}}
@media (max-width:340px){#linkText{display:none}}
.scanner{position:fixed;inset:0;z-index:50;background:rgba(4,12,18,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scanner .cam{width:min(92vw,520px,70dvh);max-width:100%}
.scanner p{color:#d7e6ee;text-align:center}
.scanner .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4);min-width:160px}
details.card{display:block}
details.card summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--fg);font-weight:500}
.net{display:grid;gap:8px;margin-top:10px}
.net label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.net input{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:13px/1.3 var(--mono);padding:10px}
.tag{font:500 11px/1 var(--mono);padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
@media (prefers-reduced-motion:reduce){.tile.leaving,.tile.arriving,.waterfill::before{animation:none}.vessel{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Pourr<span>.</span></div>
    <div class="hdr-right">
      <div class="pill" id="link"><i></i><span id="linkText">Not paired</span></div>
      <button class="btn ghost small" id="exit" hidden>Exit</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="scanner" id="scanner" hidden role="dialog" aria-label="Scan QR code">
  <div class="cam" id="scanCam"></div>
  <p id="scanMsg">Point the camera at the QR code on the other phone.</p>
  <button class="btn ghost" id="scanClose">Cancel</button>
</div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const view = $('#view');
const fmt = b => b < 1024 ? b+' B' : b < 1048576 ? (b/1024).toFixed(1)+' KB' : b < 1073741824 ? (b/1048576).toFixed(1)+' MB' : (b/1073741824).toFixed(2)+' GB';
const extOf = n => { const m = /\.([a-z0-9]{1,5})$/i.exec(n); return m ? m[1] : 'file'; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setLink(on, text){ $('#link').classList.toggle('on', on); $('#linkText').textContent = text; }

const JUG_SVG = `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 14h24l4-4h6l-6 10v30a8 8 0 0 1-8 8H24a8 8 0 0 1-8-8V20z" fill="var(--clay)"/><path d="M46 24c8 0 10 6 10 10s-3 10-10 10" fill="none" stroke="var(--clay)" stroke-width="4"/><path d="M19 34h26v16a6 6 0 0 1-6 6H25a6 6 0 0 1-6-6z" fill="var(--clay-2)" opacity=".6"/></svg>`;
const CONT_SVG = `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 10h40l-4 44a6 6 0 0 1-6 5H22a6 6 0 0 1-6-5z" fill="none" stroke="var(--water)" stroke-width="4" stroke-linejoin="round"/><path d="M15 34h34l-2 20a4 4 0 0 1-4 3H21a4 4 0 0 1-4-3z" fill="var(--water)" opacity=".7"/></svg>`;

/* ---------- signaling codec (SDP -> deflate -> base64url) ---------- */
async function pack(desc){
  // Drop TCP candidates: they are rarely used and make the QR code denser.
  const sdp = desc.sdp.split('\r\n').filter(l => !/^a=candidate:\S+ \d+ tcp /i.test(l)).join('\r\n');
  const raw = new TextEncoder().encode(desc.type[0] + sdp);
  let bytes = raw;
  if ('CompressionStream' in window) {
    const cs = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    bytes = new Uint8Array(await new Response(cs).arrayBuffer());
    return 'Z' + b64(bytes);
  }
  return 'R' + b64(bytes);
}
async function unpack(code){
  code = code.trim().replace(/\s+/g, '');
  const h = code.match(/#[oa]=(.+)$/); if (h) code = h[1];
  const kind = code[0], bytes = unb64(code.slice(1));
  let txt;
  if (kind === 'Z') {
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    txt = await new Response(ds).text();
  } else if (kind === 'R') txt = new TextDecoder().decode(bytes);
  else throw new Error('That code is not from Pourr.');
  return { type: txt[0] === 'o' ? 'offer' : 'answer', sdp: txt.slice(1) };
}
function b64(u8){ let s=''; for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length%4) s+='='; const b = atob(s); const u = new Uint8Array(b.length); for (let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function waitIce(pc){ return new Promise(res => { if (pc.iceGatheringState === 'complete') return res(); const t = setTimeout(res, 3500); pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } }); }); }

function qrImg(text){
  const q = qrcode(0, 'L'); q.addData(text, 'Byte'); q.make();
  return q.createDataURL(4, 2);
}

/* ---------- camera QR scanner ---------- */
let camStream = null, scanStop = null;
async function getCam(){
  try { return await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
  catch(e){ if (e.name === 'NotAllowedError' || e.name === 'SecurityError') throw e; return navigator.mediaDevices.getUserMedia({ video: true, audio: false }); }
}
// Granting the camera before pairing lets browsers share real local addresses, which helps on hotspots.
async function warmCamera(){ if (!camStream) camStream = await getCam(); return camStream; }
function stopCamera(){ if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
function camError(e){
  return (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError'))
    ? 'Camera access is blocked. Allow the camera for this site in your browser settings, or paste the code instead.'
    : 'The camera could not start. Close other apps using it, or paste the code instead.';
}
// Opens a full-screen scanner with a fresh camera stream; resolves with the code text, or null if cancelled.
function openScanner(){
  return new Promise(async (resolve, reject) => {
    const ov = $('#scanner'), box = $('#scanCam');
    stopCamera();
    let stream;
    try { stream = await getCam(); } catch(e){ return reject(e); }
    camStream = stream;
    const video = document.createElement('video');
    video.setAttribute('playsinline', ''); video.setAttribute('autoplay', ''); video.muted = true;
    box.innerHTML = ''; box.appendChild(video);
    ov.hidden = false;
    video.srcObject = stream;
    try { await video.play(); } catch(e){}
    let det = null;
    try { if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) det = new BarcodeDetector({ formats: ['qr_code'] }); } catch(e){}
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
    let done = false;
    const finish = val => { if (done) return; done = true; ov.hidden = true; box.innerHTML = ''; stopCamera(); scanStop = null; resolve(val); };
    scanStop = () => finish(null);
    $('#scanClose').onclick = () => finish(null);
    async function tick(){
      if (done) return;
      try {
        let val = null;
        if (det) { const r = await det.detect(video); if (r[0]) val = r[0].rawValue; }
        else if (video.videoWidth) {
          const w = Math.min(960, video.videoWidth), h = Math.round(w * video.videoHeight / video.videoWidth);
          cv.width = w; cv.height = h; cx.drawImage(video, 0, 0, w, h);
          const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
          if (r) val = r.data;
        }
        if (val) { if (navigator.vibrate) navigator.vibrate(30); return finish(val); }
      } catch(e){}
      setTimeout(() => requestAnimationFrame(tick), 60);
    }
    tick();
  });
}
async function scanButton(errEl, onCode){
  try { const v = await openScanner(); if (v) onCode(v); }
  catch(e){ errEl.textContent = camError(e); }
}

/* ---------- network settings: STUN always, optional TURN relay for strict mobile networks ---------- */
const STUN = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
function loadNet(){ try { return JSON.parse(localStorage.getItem('pourr.net') || '{}'); } catch(e){ return {}; } }
function saveNet(n){ try { localStorage.setItem('pourr.net', JSON.stringify(n)); return true; } catch(e){ return false; } }
const hasRelay = () => { const n = loadNet(); return !!(n.meteredUrl || n.turnUrl); };
async function iceServers(){
  if (navigator.onLine === false) return [];           // offline: same Wi-Fi or hotspot only
  const n = loadNet(), list = [...STUN];
  if (n.meteredUrl) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
      const j = await (await fetch(n.meteredUrl, { signal: ctl.signal })).json(); clearTimeout(t);
      const arr = Array.isArray(j) ? j : j.iceServers; if (Array.isArray(arr)) list.push(...arr);
    } catch(e){}
  }
  if (n.turnUrl) list.push({ urls: n.turnUrl.split(',').map(x => x.trim()).filter(Boolean), username: n.turnUser || '', credential: n.turnPass || '' });
  return list;
}
async function routeLabel(){
  try {
    const st = await pc.getStats(); let pair = null, locals = {};
    st.forEach(r => { if (r.type === 'transport' && r.selectedCandidatePairId) pair = st.get(r.selectedCandidatePairId); if (r.type === 'local-candidate') locals[r.id] = r; });
    if (!pair) st.forEach(r => { if (r.type === 'candidate-pair' && r.state === 'succeeded' && (r.nominated || r.selected)) pair = r; });
    const t = pair && locals[pair.localCandidateId] && locals[pair.localCandidateId].candidateType;
    return t === 'relay' ? 'Paired · via relay' : (t === 'srflx' || t === 'prflx') ? 'Paired · via internet' : 'Paired · same network';
  } catch(e){ return 'Paired'; }
}
function shareCode(text, label){
  if (navigator.share) navigator.share({ text: `${label}\n${text}` }).catch(() => {});
}

/* ---------- connection ---------- */
let pc = null, dc = null, role = null, session = 0, goneShown = false;
async function newPeer(){
  const me = pc = new RTCPeerConnection({ iceServers: await iceServers() });
  me.addEventListener('connectionstatechange', () => {
    if (me === pc && ['failed','disconnected','closed'].includes(me.connectionState)) peerGone();
  });
}
function wireChannel(ch, onOpen){
  dc = ch; dc.binaryType = 'arraybuffer';
  ch.onopen = async () => { setLink(true, 'Paired'); stopCamera(); onOpen(); setLink(true, await routeLabel()); };
  ch.onclose = () => { if (ch === dc) peerGone(); };
}
function peerGone(){
  if (!role || goneShown || !dc) return;
  goneShown = true;
  setLink(false, 'Disconnected');
  pouring = false;
  const keep = role === 'container' && received.length;
  const html = `<div class="card banner" id="goneCard"><h2>The other phone disconnected</h2>
    <p>${keep ? 'Your received files are still here. Save them before you leave.' : 'Pair again to keep pouring.'}</p>
    <button class="btn${keep ? ' ghost' : ''}" id="goHome">Back to home</button></div>`;
  const dock = $('#dock');
  if (dock) dock.insertAdjacentHTML('afterbegin', html); else view.insertAdjacentHTML('afterbegin', html);
  $('#goHome').onclick = exitToHome;
}

/* ---------- exit ---------- */
let exitArm = null;
$('#exit').onclick = () => {
  const b = $('#exit');
  const busy = sending || current !== null;
  const unsaved = role === 'container' && received.length > 0;
  if ((busy || unsaved) && !b.classList.contains('armed')) {
    b.classList.add('armed');
    b.textContent = busy ? 'Tap again to stop' : 'Unsaved files · tap again';
    clearTimeout(exitArm);
    exitArm = setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Exit'; }, 3000);
    return;
  }
  exitToHome();
};
function exitToHome(){
  try { if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ t: 'bye' })); } catch(e){}
  resetAll(); home();
}
function resetAll(){
  session++;
  const oldDc = dc, oldPc = pc; dc = null; pc = null;
  try { if (oldDc) { oldDc.onclose = null; oldDc.onmessage = null; oldDc.close(); } } catch(e){}
  try { if (oldPc) oldPc.close(); } catch(e){}
  if (scanStop) scanStop();
  stopCamera();
  window.removeEventListener('deviceorientation', onOrient);
  role = null; goneShown = false;
  jugFiles = []; pouring = false; sending = false; holdPour = false; tilt = 0; tiltOK = false;
  resumeWaiters.splice(0).forEach(r => r());
  received = []; current = null; rx = null; clearInterval(rxTick);
  const b = $('#exit'); b.classList.remove('armed'); b.textContent = 'Exit'; clearTimeout(exitArm);
}
function setStatus(text, ok){ const s = $('#status'); if (s) { s.textContent = text; s.classList.toggle('ok', !!ok); } }

/* rolling speed over the last ~1.5 s, so pauses and earlier pours don't drag the number down */
function meter(){
  const s = [];
  return {
    add(total){ const t = performance.now(); s.push([t, total]); while (s.length > 2 && t - s[0][0] > 1500) s.shift(); },
    rate(){ if (s.length < 2) return 0; const a = s[0], b = s[s.length-1], dt = (b[0]-a[0]) / 1000; return dt > 0.15 ? (b[1]-a[1]) / dt : 0; }
  };
}
const mbps = r => (r / 1048576).toFixed(1) + ' MB/s';
/* ---------- home ---------- */
function home(){

  view.className = 'home';
  const n = loadNet();
  view.innerHTML = `

    <p>Works on the same Wi-Fi or a hotspot with no internet, and across different Wi-Fi networks or mobile data when both phones are online.</p>

      <button class="role jug" id="pickJug">${JUG_SVG}<b>Jug</b><small>I'm sending. Fill the jug with files, then tilt to pour.</small></button>

/* ---------- JUG: pairing ---------- */
async function jugPair(){
  role = 'jug'; $('#exit').hidden = false;
  view.className = 'pair';
  view.innerHTML = `<div class="card"><h2>Preparing a pairing code…</h2><p>This takes a few seconds while Pourr finds the best route between the phones.</p></div>`;
  const my = session;
  try { await warmCamera(); } catch(e) { /* pairing still works; scanning may be blocked */ }
  await newPeer();
  if (my !== session) return;
  wireChannel(pc.createDataChannel('pour', { ordered: true }), jugStage);
  await pc.setLocalDescription(await pc.createOffer());
  await waitIce(pc);
  stopCamera();                                        // release it; the scanner opens a fresh camera later
  if (my !== session) return;
  const code = await pack(pc.localDescription);
  const link = location.origin + location.pathname + '#o=' + code;
  view.innerHTML = `
    <div class="card">
      <h2>Step 1 · Container scans this</h2>
      <div class="qr"><img alt="Pairing code" src="${qrImg(code)}"></div>
      <div class="row">${navigator.share ? '<button class="btn ghost" id="shareLink">Share link</button>' : ''}<button class="btn ghost" id="copy">Copy code</button></div>
      <p class="note">Far apart? Share the link through any chat app and open it on the receiving phone.</p>
      <textarea id="myCode" readonly hidden>${code}</textarea>
    </div>
    <div class="card">
      <h2>Step 2 · Scan the Container's reply</h2>
      <button class="btn clay" id="scanReply">Scan reply code</button>
      <details><summary>Paste the reply code instead</summary><textarea id="paste" placeholder="Paste reply code"></textarea><button class="btn ghost" id="usePaste" style="margin-top:8px">Connect</button></details>
      <div class="err" id="err" aria-live="polite"></div>
    </div>
    <button class="btn ghost" id="back">Back</button>`;
  $('#back').onclick = exitToHome;
  $('#copy').onclick = () => { copyText(code, $('#myCode')); $('#copy').textContent = 'Copied'; };
  if ($('#shareLink')) $('#shareLink').onclick = () => shareCode(link, 'Open this link to receive files with Pourr:');
  let timer = null;
  const accept = async (c) => {
    try {
      const d = await unpack(c); if (d.type !== 'answer') throw new Error('That is a pairing code. Scan the reply code from the Container phone.');
      await pc.setRemoteDescription(d); $('#err').textContent = 'Connecting…';
      clearTimeout(timer);
      timer = setTimeout(() => { if (my === session && (!dc || dc.readyState !== 'open')) $('#err').textContent = hasRelay()
        ? 'Still connecting. Check both phones are online, then go back and pair again.'
        : 'Still connecting. If the phones are on different networks or mobile data, add a relay on the home screen and pair again.'; }, 15000);
    } catch(e){ $('#err').textContent = e.message || 'That code did not work. Try again.'; }
  };
  $('#scanReply').onclick = () => scanButton($('#err'), accept);
  $('#usePaste').onclick = () => accept($('#paste').value);
}

/* ---------- CONTAINER: pairing ---------- */
async function contPair(preset){
  role = 'container'; $('#exit').hidden = false;
  view.className = 'pair';
  view.innerHTML = `
    <div class="card">
      <h2>Step 1 · Scan the Jug's code</h2>
      <button class="btn water" id="scan">Scan pairing code</button>
      <details><summary>Paste the code or link instead</summary><textarea id="paste" placeholder="Paste pairing code or link"></textarea><button class="btn ghost" id="usePaste" style="margin-top:8px">Continue</button></details>
      <div class="err" id="err" aria-live="polite"></div>
    </div>
    <button class="btn ghost" id="back">Back</button>`;
  $('#back').onclick = exitToHome;
  const my = session;
  const accept = async (c) => {
    try {
      const d = await unpack(c); if (d.type !== 'offer') throw new Error('That is a reply code. Scan the pairing code from the Jug phone.');
      $('#err').textContent = 'Preparing your reply code…';
      await newPeer();
      if (my !== session) return;
      pc.ondatachannel = e => wireChannel(e.channel, contStage);
      await pc.setRemoteDescription(d);
      await pc.setLocalDescription(await pc.createAnswer());
      await waitIce(pc);
      if (my !== session) return;
      const code = await pack(pc.localDescription);
      view.innerHTML = `
        <div class="card">
          <h2>Step 2 · Jug scans this reply</h2>
          <div class="qr"><img alt="Reply code" src="${qrImg(code)}"></div>
          <div class="row">${navigator.share ? '<button class="btn ghost" id="shareCode">Share code</button>' : ''}<button class="btn ghost" id="copy">Copy code</button></div>
          <p class="note">This screen switches to the container as soon as the phones connect. Far apart? Share the code and paste it on the Jug phone.</p>
          <textarea id="myCode" readonly hidden>${code}</textarea>
        </div>
        <button class="btn ghost" id="back2">Start over</button>`;
      $('#copy').onclick = () => { copyText(code, $('#myCode')); $('#copy').textContent = 'Copied'; };
      if ($('#shareCode')) $('#shareCode').onclick = () => shareCode(code, 'Pourr reply code. Paste it on the Jug phone:');
      $('#back2').onclick = exitToHome;
    } catch(e){ if ($('#err')) $('#err').textContent = e.message || 'That code did not work. Try again.'; }
  };
  $('#scan').onclick = () => scanButton($('#err'), accept);
  $('#usePaste').onclick = () => accept($('#paste').value);
  if (preset) accept(preset);
}

function copyText(t, ta){
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(() => fallbackCopy(ta));
  else fallbackCopy(ta);
}
function fallbackCopy(ta){ ta.hidden = false; ta.select(); try { document.execCommand('copy'); } catch(e){} }

/* ---------- tilt sensing ---------- */
const POUR_ANGLE = 40;
let tilt = 0, tiltOK = false, holdPour = false;
function onOrient(e){
  const g = e.gamma || 0, b = e.beta || 0;
  tilt = (screen.orientation && Math.abs(screen.orientation.angle) === 90) ? b : g;
  tiltOK = true;
}
async function enableTilt(){
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') return false;
    }
    window.addEventListener('deviceorientation', onOrient);
    return true;
  } catch(e){ return false; }
}

/* ---------- JUG stage: fill + pour ---------- */
let jugFiles = [];       // queue, first in first out
let pouring = false, sending = false, resumeWaiters = [];
const CHUNK_DEFAULT = 64 * 1024;
function chunkSize(){ const m = pc?.sctp?.maxMessageSize; return Math.max(16384, Math.min(m && isFinite(m) ? m : CHUNK_DEFAULT, 256 * 1024)); }

function jugStage(){
  view.className = 'work';
  view.innerHTML = `
    <div class="stage">
      <div class="tilt-read" id="tiltRead">tilt 0°</div>
      <div class="speed" id="speed"></div>
      <div class="vessel" id="vessel">
        <svg class="shape" viewBox="0 0 200 280" preserveAspectRatio="none" aria-hidden="true">
          <path d="M150 52 C 196 52 196 150 150 156" fill="none" stroke="var(--clay)" stroke-width="12" stroke-linecap="round"/>
          <path d="M22 30 L178 30 L196 8 M22 30 Q 16 40 20 60 L 26 248 Q 28 272 54 272 L 146 272 Q 172 272 174 248 L 180 60 Q 184 40 178 30" fill="none" stroke="var(--clay)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <div class="inside" id="inside"><div class="waterfill" id="fill" style="background:linear-gradient(180deg,color-mix(in srgb,var(--clay-2) 45%,transparent),color-mix(in srgb,var(--clay) 55%,transparent))"></div></div>
        <div class="empty" id="empty">The jug is empty.<br>Add files to fill it.</div>
      </div>
      <div class="gauge" id="gauge"></div>
    </div>
    <div class="dock" id="dock">
      <div class="status" id="status"></div>
      <input type="file" id="pick" multiple hidden>
      <div class="row">
        <button class="btn ghost" id="add">Add files</button>
        <button class="btn clay" id="tiltBtn">Enable tilt to pour</button>
      </div>
      <button class="btn ghost" id="hold" disabled>Hold here to pour (no tilt sensor)</button>
    </div>`;
  dc.onmessage = e => { if (typeof e.data === 'string') { try { if (JSON.parse(e.data).t === 'bye') peerGone(); } catch(_){} } };
  $('#add').onclick = () => $('#pick').click();
  $('#pick').onchange = e => { addToJug([...e.target.files]); e.target.value = ''; };
  $('#tiltBtn').onclick = async () => {
    const ok = await enableTilt();
    $('#tiltBtn').textContent = ok ? 'Tilt is on · tip to pour' : 'Tilt unavailable · use hold';
    $('#tiltBtn').disabled = true;
    if (!ok) $('#hold').disabled = false;
    setTimeout(() => { if (!tiltOK && $('#hold')) $('#hold').disabled = false; }, 1500);
  };
  const hold = $('#hold');
  const on = e => { e.preventDefault(); holdPour = true; }, off = () => { holdPour = false; };
  hold.addEventListener('pointerdown', on); hold.addEventListener('pointerup', off); hold.addEventListener('pointerleave', off); hold.addEventListener('pointercancel', off);
  if (!('DeviceOrientationEvent' in window)) hold.disabled = false;
  renderJug();
  const my = session; requestAnimationFrame(() => jugLoop(my));
}
function addToJug(files){
  for (const f of files) jugFiles.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Math.random()), file: f, sent: 0, el: null });
  renderJug();
  if (!sending) setStatus(jugFiles.length ? `${jugFiles.length} file${jugFiles.length>1?'s':''} in the jug · tilt to pour` : '');
}
function tileHTML(name, size){ return `<span class="cnt" hidden></span><div class="ext">${esc(extOf(name)).slice(0,4)}</div><div style="min-width:0"><div class="nm">${esc(name)}</div><div class="sz">${fmt(size)}</div></div><div class="bar"><b></b></div>`; }
function renderJug(){
  const inside = $('#inside'); if (!inside) return;
  for (const it of jugFiles) if (!it.el) { it.el = document.createElement('div'); it.el.className = 'tile'; it.el.innerHTML = tileHTML(it.file.name, it.file.size); inside.appendChild(it.el); }
  const total = jugFiles.reduce((a,b) => a + b.file.size, 0), left = jugFiles.reduce((a,b) => a + b.file.size - b.sent, 0);
  $('#empty').hidden = jugFiles.length > 0;
  $('#fill').style.height = jugFiles.length ? Math.max(12, Math.min(92, 18 + jugFiles.length * 9)) * (total ? left/total : 1) + '%' : '0%';
  $('#gauge').textContent = jugFiles.length ? `${jugFiles.length} file${jugFiles.length>1?'s':''} · ${fmt(left)} to pour` : '';
}
function jugLoop(my){
  if (my !== session || role !== 'jug' || !$('#vessel')) return;
  const ang = holdPour ? 55 : tilt;
  const vis = Math.max(-75, Math.min(75, ang));
  $('#vessel').style.transform = `rotate(${vis}deg)`;
  $('#tiltRead').textContent = holdPour ? 'pouring (hold)' : `tilt ${Math.round(Math.abs(ang))}°`;
  const want = (Math.abs(ang) >= POUR_ANGLE) && jugFiles.length > 0 && dc && dc.readyState === 'open';
  if (want !== pouring) {
    pouring = want;
    document.documentElement.style.setProperty('--dx', (ang < 0 ? '-160%' : '160%'));
    document.documentElement.style.setProperty('--rot', (ang < 0 ? '-35deg' : '35deg'));
    if (pouring) resumeWaiters.splice(0).forEach(r => r());
  }
  if (pouring && !sending && jugFiles.length) pourQueue();
  requestAnimationFrame(() => jugLoop(my));
}
const waitPour = () => pouring ? Promise.resolve() : new Promise(r => resumeWaiters.push(r));
function waitDrain(ch){ return new Promise(r => { if (ch.bufferedAmount <= ch.bufferedAmountLowThreshold) return r(); ch.addEventListener('bufferedamountlow', r, { once: true }); }); }

async function pourQueue(){
  const my = session, ch = dc;
  sending = true;
  const CH = chunkSize(), HIGH = 4 * 1048576;
  ch.bufferedAmountLowThreshold = 1048576;
  let idx = 0, bytes = 0;
  const m = meter();
  const tick = setInterval(() => {
    m.add(bytes); const r = m.rate(), el = $('#speed');
    if (el) el.textContent = r > 0 ? mbps(r) : (pouring ? '' : 'paused');
  }, 250);
  const live = () => my === session && ch === dc && ch.readyState === 'open';
  try {
    ch.send(JSON.stringify({ t: 'batch' }));
    while (jugFiles.length) {
      await waitPour(); if (!live()) return;
      const it = jugFiles[0], f = it.file;              // first in, first out
      idx++;
      const of = idx - 1 + jugFiles.length;
      const cnt = it.el.querySelector('.cnt'); cnt.hidden = false; cnt.textContent = `${idx} of ${of}`;
      setStatus(`Pouring ${idx} of ${of} · ${f.name}`);
      ch.send(JSON.stringify({ t: 'meta', id: it.id, name: f.name, size: f.size, type: f.type, idx, of }));
      const READ = 4 * 1048576;                          // read big slices, send small chunks
      for (let off = 0; off < f.size; off += READ) {
        const buf = await f.slice(off, off + READ).arrayBuffer();
        for (let p = 0; p < buf.byteLength; p += CH) {
          if (!pouring) await waitPour();
          if (ch.bufferedAmount > HIGH) await waitDrain(ch);
          if (!live()) return;
          ch.send(buf.slice(p, p + CH));
          const n = Math.min(CH, buf.byteLength - p); it.sent += n; bytes += n;
        }
        it.el.querySelector('.bar b').style.width = (it.sent / f.size * 100) + '%';
        renderJug();
      }
      ch.send(JSON.stringify({ t: 'end', id: it.id }));
      cnt.textContent = `✓ ${idx} of ${of}`;
      it.el.classList.add('done', 'leaving');
      const el = it.el; setTimeout(() => el.remove(), 700);
      jugFiles.shift(); renderJug();
    }
    ch.send(JSON.stringify({ t: 'done', count: idx }));
    setStatus(`Complete · ${idx} of ${idx} poured. The jug is empty.`, true);
    if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
  } catch(e) { if (my === session) setStatus('Pour stopped: the connection dropped.'); }
  finally {
    clearInterval(tick);
    if (my === session) { sending = false; const el = $('#speed'); if (el) el.textContent = ''; }
  }
}

/* ---------- CONTAINER stage: catch + save ---------- */
let received = [], current = null, rx = null, rxTick = null, uiPending = false;
function contStage(){
  view.className = 'work';
  view.innerHTML = `
    <div class="stage">
      <div class="tilt-read">holding upright</div>
      <div class="speed" id="speed"></div>
      <div class="vessel">
        <svg class="shape" viewBox="0 0 200 280" preserveAspectRatio="none" aria-hidden="true">
          <path d="M14 22 L186 22 L174 252 Q 172 274 148 274 L 52 274 Q 28 274 26 252 Z" fill="none" stroke="var(--water)" stroke-width="7" stroke-linejoin="round"/>
          <path d="M8 22 L192 22" stroke="var(--water)" stroke-width="9" stroke-linecap="round"/>
        </svg>
        <div class="inside" id="inside"><div class="waterfill" id="fill"></div></div>
        <div class="empty" id="empty">Waiting for the jug to pour…</div>
      </div>
      <div class="gauge" id="gauge"></div>
    </div>
    <div class="dock" id="dock"><div class="status" id="status"></div><div id="saveArea"></div></div>`;
  dc.onmessage = onRx;
}
function startRxBatch(){
  clearInterval(rxTick);
  rx = { idx: 0, of: 0, start: received.length, bytes: 0 };
  const m = meter(), my = session;
  rxTick = setInterval(() => {
    if (my !== session || !rx) return clearInterval(rxTick);
    m.add(rx.bytes); const r = m.rate(), el = $('#speed'); if (el) el.textContent = r > 0 ? mbps(r) : '';
  }, 250);
  $('#empty').hidden = true;
  $('#saveArea').innerHTML = '';
}
function onRx(e){
  if (typeof e.data === 'string') {
    const m = JSON.parse(e.data);
    if (m.t === 'bye') return peerGone();
    if (m.t === 'batch') startRxBatch();
    else if (m.t === 'meta') {
      if (!rx) startRxBatch();
      const el = document.createElement('div'); el.className = 'tile arriving'; el.innerHTML = tileHTML(m.name, m.size);
      const cnt = el.querySelector('.cnt'); cnt.hidden = false; cnt.textContent = `${m.idx} of ${m.of}`;
      $('#inside').appendChild(el);                    // column-reverse: first file settles at the bottom
      current = { ...m, chunks: [], got: 0, el };
      rx.idx = m.idx; rx.of = m.of;
      scheduleUI();
    }
    else if (m.t === 'end' && current) {
      const file = new File(current.chunks, current.name, { type: current.type || 'application/octet-stream' });
      current.chunks = null;
      current.el.classList.add('done');
      current.el.querySelector('.bar b').style.width = '100%';
      current.el.querySelector('.cnt').textContent = `✓ ${current.idx} of ${current.of}`;
      received.push(file); current = null;
      if (navigator.vibrate) navigator.vibrate(10);
      scheduleUI();
    }
    else if (m.t === 'done') finishRx(m.count);
    return;
  }
  if (!current) return;
  current.chunks.push(e.data); current.got += e.data.byteLength; rx.bytes += e.data.byteLength;
  scheduleUI();
}
// Draw progress at most once per frame instead of on every chunk.
function scheduleUI(){ if (uiPending) return; uiPending = true; requestAnimationFrame(() => { uiPending = false; drawRx(); }); }
function drawRx(){
  if (!rx || !$('#fill')) return;
  const doneN = received.length - rx.start, frac = current && current.size ? current.got / current.size : 0;
  $('#fill').style.height = Math.min(92, ((doneN + frac) / (rx.of || 1)) * 92) + '%';
  if (current) {
    current.el.querySelector('.bar b').style.width = (frac * 100) + '%';
    setStatus(`Receiving ${current.idx} of ${current.of} · ${fmt(current.got)} of ${fmt(current.size)}`);
  }
  $('#gauge').textContent = received.length ? `${received.length} file${received.length>1?'s':''} ready to save` : '';
}
function finishRx(count){
  clearInterval(rxTick); rx = null;
  const sp = $('#speed'); if (sp) sp.textContent = '';
  $('#fill').style.height = '92%';
  setStatus(`Complete · ${count} of ${count} received`, true);
  $('#gauge').textContent = `${received.length} file${received.length>1?'s':''} ready to save`;
  showSaveCard();
}
function showSaveCard(){
  const n = received.length; if (!n) return;
  const size = received.reduce((a,b) => a + b.size, 0);
  const canDir = 'showDirectoryPicker' in window;
  let canShare = false; try { canShare = !!(navigator.canShare && navigator.canShare({ files: received })); } catch(e){}
  const note = canDir
    ? 'Choose folder lets you pick any folder on this device.'
    : canShare
      ? 'Save to Files opens your phone\'s file browser so you can pick a folder. On iPhone, choose "Save to Files" in the share sheet.'
      : 'To choose a folder for downloads, turn on "Ask where to save files" in your browser\'s download settings.';
  $('#saveArea').innerHTML = `
    <div class="card">
      <h2>Save ${n} file${n>1?'s':''} to this ${/Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'phone' : 'device'}?</h2>
      <p>${fmt(size)} in total. ${note}</p>
      <div class="save-opts">
        ${canDir ? '<button class="btn water" id="saveDir">Choose folder…</button>' : ''}
        ${canShare ? `<button class="btn ${canDir ? 'ghost' : 'water'}" id="saveShare">Save to Files…</button>` : ''}
        <button class="btn ${canDir || canShare ? 'ghost' : 'water'}" id="saveDl">Save to Downloads</button>
        <button class="btn ghost" id="discard">Discard</button>
      </div>
      <div class="saved-list" id="list"></div>
    </div>`;
  if (canDir) $('#saveDir').onclick = saveToFolder;
  if (canShare) $('#saveShare').onclick = saveViaShare;
  $('#saveDl').onclick = saveDownloads;
  $('#discard').onclick = () => { clearReceived(); setStatus('Discarded. Ready for the next pour.'); };
}
async function saveToFolder(){
  let dir;
  try { dir = await window.showDirectoryPicker({ id: 'pourr', mode: 'readwrite', startIn: 'downloads' }); }
  catch(e){ return; }                                  // picker cancelled
  const files = received.slice();
  try {
    let i = 0;
    for (const f of files) {
      i++; setStatus(`Saving ${i} of ${files.length} · ${f.name}`);
      const h = await dir.getFileHandle(await freeName(dir, f.name), { create: true });
      const w = await h.createWritable(); await w.write(f); await w.close();
    }
    clearReceived();
    setStatus(`Saved ${files.length} of ${files.length} to "${dir.name}"`, true);
  } catch(e){ setStatus('Could not save to that folder. Try another folder or Save to Downloads.'); }
}
async function freeName(dir, name){
  const dot = name.lastIndexOf('.'), base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
  let n = name, k = 1;
  for (;;) { try { await dir.getFileHandle(n); n = `${base} (${k++})${ext}`; } catch(e){ return n; } }
}
async function saveViaShare(){
  const files = received.slice();
  try { await navigator.share({ files }); clearReceived(); setStatus(`Sent ${files.length} file${files.length>1?'s':''} to your chosen app`, true); }
  catch(e){ if (e.name !== 'AbortError') setStatus('Save to Files is not available here. Use Save to Downloads.'); }
}
async function saveDownloads(){
  const files = received.slice(), list = $('#list'); list.innerHTML = '';
  for (const f of files) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.textContent = 'Save ' + f.name;
    list.appendChild(a); a.click(); await new Promise(r => setTimeout(r, 350));
  }
  setStatus(`Saved ${files.length} of ${files.length} to Downloads. Tap a name if one was blocked.`, true);
  const done = document.createElement('button'); done.className = 'btn ghost'; done.textContent = 'Done';
  done.onclick = () => { clearReceived(); setStatus('Ready for the next pour.'); };
  list.appendChild(done);
}
function clearReceived(){
  received = [];
  document.querySelectorAll('#inside .tile').forEach(t => t.remove());
  const f = $('#fill'); if (f) f.style.height = '0%';
  const em = $('#empty'); if (em) em.hidden = false;
  const sa = $('#saveArea'); if (sa) sa.innerHTML = '';
  const g = $('#gauge'); if (g) g.textContent = '';
}

/* ---------- boot ---------- */
if (!window.RTCPeerConnection) {
  view.innerHTML = `<h1>This browser can't pair phones.</h1><p>Open this page in Chrome, Safari or Firefox on a phone.</p>`;
} else {
  const m = location.hash.match(/^#o=(.+)$/);
  if (m) { history.replaceState(null, '', location.pathname); contPair(m[1]); } else home();
}
try { navigator.wakeLock?.request('screen').catch(()=>{}); } catch(e){}
</script>
